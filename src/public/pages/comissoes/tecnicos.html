<div class="d-flex justify-content-between page-heading"><div><h1>Técnicos</h1><p class="text-secondary">Cadastros e saldos reais</p></div><button id="novoTecnico" class="btn btn-success"><i class="bi bi-person-plus"></i> Cadastrar técnico</button></div>
<div id="alertaComissoes" class="alert d-none"></div>
<div class="row g-3 mb-4"><div class="col-md-4"><div class="card bg-secondary border-0"><div class="card-body"><small>Ativos</small><h2 id="tecAtivos">0</h2></div></div></div><div class="col-md-4"><div class="card bg-secondary border-0"><div class="card-body"><small>Saldo acumulado</small><h2 id="tecTotal">R$ 0,00</h2></div></div></div><div class="col-md-4"><div class="card bg-secondary border-0"><div class="card-body"><small>Disponível</small><h2 id="tecLiberado">R$ 0,00</h2></div></div></div></div>
<div class="card bg-dark border-secondary"><div class="card-header d-flex gap-2"><input id="buscaTecnico" class="form-control" placeholder="Pesquisar técnico..."><select id="statusTecnico" class="form-select" style="max-width:180px"><option value="">Todos</option><option value="1">Ativos</option><option value="0">Inativos</option></select></div><div class="table-responsive"><table class="table table-dark table-hover mb-0"><thead><tr><th>Nome</th><th>Código OG1</th><th>Contato</th><th>Total</th><th>Liberado</th><th>Pendente</th><th>Status</th><th></th></tr></thead><tbody id="tabelaTecnicos"></tbody></table></div></div>
<div class="modal fade" id="modalTecnico" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content bg-dark text-light"><div class="modal-header"><h5 id="tituloTecnico" class="modal-title">Cadastrar técnico</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="tecnicoId" type="hidden"><div class="row g-3"><div class="col-md-8"><label class="form-label">Nome *</label><input id="tecnicoNome" class="form-control"></div><div class="col-md-4"><label class="form-label">Código OG1 *</label><input id="tecnicoCodigo" class="form-control"></div><div class="col-md-6"><label class="form-label">Telefone</label><input id="tecnicoTelefone" class="form-control"></div><div class="col-md-6"><label class="form-label">E-mail</label><input id="tecnicoEmail" type="email" class="form-control"></div><div class="col-md-4"><label class="form-label">CPF/CNPJ</label><input id="tecnicoDocumento" class="form-control"></div><div class="col-md-4"><label class="form-label">Comissão (%)</label><input id="tecnicoTaxa" type="number" step="0.01" value="3" class="form-control"></div><div class="col-md-4"><label class="form-label">Status</label><select id="tecnicoAtivo" class="form-select"><option value="1">Ativo</option><option value="0">Inativo</option></select></div></div></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button id="salvarTecnico" class="btn btn-success">Salvar</button></div></div></div></div>
