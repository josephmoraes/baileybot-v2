<section class="reactivation-page">
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-3">
    <div><p class="dashboard-eyebrow mb-1">REATIVAÇÃO</p><h1 class="h3 mb-1">Relatórios</h1><p class="text-secondary mb-0">Importe razão social e valor comprado, revise e aprove com o Código OG1.</p></div>
    <div><input id="rcReportFile" class="d-none" type="file" accept=".csv,.xlsx,.xls,.pdf"><button id="rcImportReport" class="btn btn-success"><i class="bi bi-upload me-1"></i> Importar relatório</button></div>
  </div>
  <div id="rcReportAlert" class="alert d-none"></div>
  <div class="row g-4">
    <div class="col-xl-4"><div class="dashboard-panel h-100"><div class="dashboard-panel-header"><div><h2>Arquivos importados</h2><p>Selecione para revisar</p></div></div><div id="rcReportList" class="d-grid gap-2"></div></div></div>
    <div class="col-xl-8"><div class="dashboard-panel h-100"><div class="d-flex flex-wrap justify-content-between gap-2 mb-3"><div><h2 id="rcReportTitle" class="h5 mb-1">Selecione um relatório</h2><p id="rcReportSummary" class="text-secondary small mb-0"></p></div><select id="rcReportStatus" class="form-select form-select-sm" style="max-width:180px"><option value="todos">Todos</option><option value="pendente">Pendentes</option><option value="aprovado">Aprovados</option><option value="excluido">Excluídos</option></select></div><div class="table-responsive"><table class="table table-dark table-hover align-middle"><thead><tr><th>Razão social</th><th class="text-end">Valor comprado</th><th>Correspondência</th><th>Status</th><th class="text-end">Ações</th></tr></thead><tbody id="rcReportRows"><tr><td colspan="5" class="text-center text-secondary py-5">Nenhum relatório selecionado.</td></tr></tbody></table></div></div></div>
  </div>
</section>

<div class="modal fade" id="rcReportClientModal" tabindex="-1"><div class="modal-dialog modal-xl modal-dialog-scrollable"><form class="modal-content bg-dark text-light" id="rcReportClientForm"><div class="modal-header border-secondary"><h2 class="modal-title h5">Revisar cliente do relatório</h2><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="rrRowId"><div class="row g-3">
  <div class="col-md-3"><label class="form-label">Código OG1 *</label><input class="form-control" id="rrCodigo" required></div><div class="col-md-5"><label class="form-label">Cliente / empresa *</label><input class="form-control" id="rrEmpresa" required></div><div class="col-md-4"><label class="form-label">Contato</label><input class="form-control" id="rrNome"></div>
  <div class="col-md-4"><label class="form-label">Telefone</label><input class="form-control" id="rrTelefone"></div><div class="col-md-4"><label class="form-label">Responsável</label><input class="form-control" id="rrVendedor" list="rrVendedores"></div><div class="col-md-4"><label class="form-label">Status</label><select class="form-select" id="rrStatus"></select></div>
  <div class="col-md-4"><label class="form-label">Última movimentação</label><input class="form-control" id="rrUltimaData" type="date"></div><div class="col-md-4"><label class="form-label">Valor da última</label><input class="form-control" id="rrUltimoValor" inputmode="decimal"></div><div class="col-md-4"><label class="form-label">Valor acumulado</label><input class="form-control" id="rrAcumulado" inputmode="decimal"></div>
  <div class="col-md-4"><label class="form-label">Próximo contato</label><input class="form-control" id="rrProximoContato" type="date"></div><div class="col-md-8"><label class="form-label">Observação</label><textarea class="form-control" id="rrObservacao" rows="2"></textarea></div><div class="col-12"><label class="form-label">Etiquetas</label><div id="rrEtiquetas" class="d-flex flex-wrap gap-2"></div></div>
  <div class="col-12"><div id="rrMatchNotice" class="alert alert-info d-none mb-0"></div></div>
</div><datalist id="rrVendedores"><option>Alisson</option><option>Noberto</option><option>Aldener</option><option>Letícia</option><option>Clayton</option></datalist></div><div class="modal-footer border-secondary"><button class="btn btn-outline-light" type="button" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-outline-success" type="button" id="rrSaveRow">Salvar alterações</button><button class="btn btn-success" type="submit">Aprovar para Vendedores</button></div></form></div></div>
