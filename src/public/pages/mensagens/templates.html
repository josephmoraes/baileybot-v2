<h1 class="mb-4">Templates de Mensagens</h1>

<div class="card shadow-sm">

    <div class="card-header d-flex justify-content-between align-items-center">

        <h5 class="mb-0">Templates Cadastrados</h5>

        <button
            class="btn btn-primary"
            id="btnNovoTemplate">

            Novo Template

        </button>

    </div>

    <div class="card-body">

        <table class="table table-hover align-middle">

            <thead>

                <tr>
                    <th>Nome</th>
                    <th>Status</th>
                    <th width="180">Ações</th>
                </tr>

            </thead>

            <tbody id="tabelaTemplates">

                <tr>

                    <td colspan="3" class="text-center text-secondary py-4">

                        Carregando...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

<div
    class="modal fade"
    id="modalTemplate"
    tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="tituloModalTemplate">

                    Novo Template

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"></button>

            </div>

            <div class="modal-body">

                <div class="mb-3">

                    <label class="form-label">
                        Nome
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="nomeTemplate">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Mensagem
                    </label>

                    <textarea
                        class="form-control"
                        rows="8"
                        id="mensagemTemplate"></textarea>

                </div>

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="ativoTemplate"
                        checked>

                    <label
                        class="form-check-label"
                        for="ativoTemplate">

                        Template ativo

                    </label>

                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancelar

                </button>

                <button
                    class="btn btn-primary"
                    id="btnSalvarTemplate">

                    Salvar

                </button>

            </div>

        </div>

    </div>

</div>
