<h1 class="mb-4">Envio de Mensagens</h1>

<div class="card shadow-sm">

    <div class="card-body">

        <div class="mb-3">

            <label class="form-label">

                Template

            </label>

            <select
                class="form-select"
                id="templateSelect">

                <option>

                    Carregando...

                </option>

            </select>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Pré-visualização da Mensagem

            </label>

            <textarea
                class="form-control"
                rows="8"
                id="previewMensagem"
                readonly></textarea>

        </div>

        <button
            class="btn btn-success"
            id="btnEnviar">

            Iniciar Envio

        </button>

    </div>

</div>
