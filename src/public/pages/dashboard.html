<h1 class="mb-4">Dashboard</h1>

<!-- Cards -->
<div class="row g-4 mb-5">

    <!-- Clientes -->
    <div class="col-md-6 col-xl-3">
        <div class="card bg-secondary text-light border-0 shadow h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">

                    <div>
                        <h2 id="totalClientes">0</h2>
                        <p class="text-light-emphasis mb-0">
                            Clientes cadastrados
                        </p>
                    </div>

                    <i class="bi bi-people fs-1 text-primary"></i>

                </div>
            </div>
        </div>
    </div>

    <!-- Campanhas -->
    <div class="col-md-6 col-xl-3">
        <div class="card bg-secondary text-light border-0 shadow h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">

                    <div>
                        <h2 id="totalCampanhas">0</h2>
                        <p class="text-light-emphasis mb-0">
                            Campanhas criadas
                        </p>
                    </div>

                    <i class="bi bi-send fs-1 text-warning"></i>

                </div>
            </div>
        </div>
    </div>

    <!-- WhatsApp -->
    <div class="col-md-6 col-xl-3">
        <div class="card bg-secondary text-light border-0 shadow h-100">

            <div class="card-body">

                <!-- Cabeçalho -->
                <div class="d-flex justify-content-between align-items-center">

                    <h5 class="mb-0">WhatsApp</h5>

                    <i class="bi bi-whatsapp text-success fs-2"></i>

                </div>

                <!-- Status -->
                <div class="text-center my-4">

                    <span id="statusWhatsappCard"
                        class="badge border bg-light text-dark fs-6 px-3 py-2">
                        Carregando...
                    </span>

                </div>

                <!-- Botões -->
                <div class="d-flex justify-content-center gap-2">

                    <button id="btnConectar"
                        class="btn btn-success btn-sm">
                        <i class="bi bi-play-fill"></i>
                        Iniciar
                    </button>

                    <button id="btnDesconectar"
                        class="btn btn-danger btn-sm">
                        <i class="bi bi-stop-fill"></i>
                        Parar
                    </button>

                </div>

            </div>

        </div>
    </div>

</div>
