<h1 class="mb-4">Clientes</h1>

<!-- Barra de Pesquisa -->
<div class="mb-3">
    <input
        type="text"
        id="pesquisaCliente"
        class="form-control"
        placeholder="🔍 Pesquisar por código, empresa, nome ou telefone..."
    >
</div>

<!-- Tabela -->
<div class="card bg-secondary text-light border-0 shadow">

    <div class="card-header d-flex justify-content-between align-items-center">

        <span>Clientes</span>

        <div class="d-flex gap-2">

            <button
                type="button"
                class="btn btn-success btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#modalCliente">

                <i class="bi bi-plus-circle"></i>
                Novo Cliente

            </button>

            <button
                type="button"
                id="btnImportarClientes"
                class="btn btn-primary btn-sm"
                title="Importar Excel">

                <i class="bi bi-file-earmark-excel"></i>
                Importar

            </button>

            <input id="arquivoClientesExcel" type="file" class="d-none" accept=".xlsx,.xls,.csv">

            <button
                type="button"
                id="btnExportarClientes"
                class="btn btn-outline-light btn-sm"
                title="Exportar Excel">

                <i class="bi bi-download"></i>
                Exportar

            </button>

        </div>

    </div>

    <div class="table-responsive">

        <table class="table table-dark table-hover align-middle mb-0">

            <thead>

                <tr>

                    <th>Código</th>
                    <th>Nome da Empresa</th>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Data</th>
                    <th width="120">Ações</th>

                </tr>

            </thead>

            <tbody id="tabelaClientes">

                <tr>

                    <td colspan="6" class="text-center text-secondary py-4">
                        Nenhum cliente cadastrado.
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

<!-- Modal Cliente -->
<div class="modal fade" id="modalCliente" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content bg-dark text-light">

            <div class="modal-header">

                <h5 class="modal-title">
                    Novo Cliente
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="mb-3">
                    <label class="form-label">Código do cliente</label>
                    <input type="text" class="form-control" id="customer_code">
                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Nome da Empresa
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="company_name">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Nome
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="name">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Telefone
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="telefone"
                        placeholder="(00) 0000-0000 ou (00) 00000-0000"
                        maxlength="15">

                    <div class="form-text text-light-emphasis">
                        Aceita telefone residencial ou celular, sempre com DDD.
                    </div>

                </div>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancelar

                </button>

                <button
                    type="button"
                    class="btn btn-success"
                    id="btnSalvarCliente">

                    Salvar

                </button>

            </div>

        </div>

    </div>

</div>
