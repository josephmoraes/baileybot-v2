<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BaileyBot V2</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="bg-dark text-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-black border-bottom border-secondary sticky-top">

        <div class="container-fluid">

            <div class="d-flex align-items-center gap-3">
                <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div>
                <span class="navbar-brand fw-bold">
                    <i class="bi bi-whatsapp text-success"></i>
                    BaileyBot V2
                </span>

                <div class="small text-secondary">
                    Sistema de automação para WhatsApp
                </div>
                </div>
            </div>

            <div class="d-flex align-items-center gap-2 ms-auto">
                <button class="btn btn-success btn-sm d-none d-sm-inline-flex align-items-center" data-whatsapp-action="connect">
                    <i class="bi bi-play-fill"></i> Iniciar
                </button>
                <button class="btn btn-outline-danger btn-sm d-none d-sm-inline-flex align-items-center" data-whatsapp-action="disconnect">
                    <i class="bi bi-stop-fill"></i> Parar
                </button>
                <span id="statusWhatsappNav" class="badge bg-secondary fs-6">Carregando...</span>
            </div>

        </div>

    </nav>

    <div class="container-fluid">

        <div class="row">

            <!-- Sidebar -->
            <aside id="sidebarMenu" class="col-lg-2 bg-black border-end border-secondary collapse d-lg-block sidebar">

                <div class="list-group list-group-flush mt-4">

                    <a href="#"
                        class="list-group-item list-group-item-action bg-black text-light border-secondary active"
                        data-page="dashboard">
                        <i class="bi bi-speedometer2 me-2"></i>
                        Dashboard
                    </a>

                    <a href="#"
                        class="list-group-item list-group-item-action bg-black text-light border-secondary"
                        data-page="clientes">
                        <i class="bi bi-people me-2"></i>
                        Clientes
                    </a>

                    <a href="#"
                        class="list-group-item list-group-item-action bg-black text-light border-secondary"
                        data-page="historico">
                        <i class="bi bi-clock-history me-2"></i>
                        Histórico
                    </a>

                    <a href="#"
                        class="list-group-item list-group-item-action bg-black text-light border-secondary"
                        data-page="campanhas">
                        <i class="bi bi-send me-2"></i>
                        Campanhas
                    </a>

                    <button
                        class="list-group-item list-group-item-action bg-black text-light border-secondary d-flex align-items-center"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#submenuComissoes"
                        aria-expanded="false"
                        aria-controls="submenuComissoes">
                        <i class="bi bi-cash-coin me-2"></i>
                        <span>Comissões</span>
                        <i class="bi bi-chevron-down ms-auto small"></i>
                    </button>

                    <div class="collapse commission-submenu" id="submenuComissoes">
                        <a href="#" class="list-group-item list-group-item-action bg-black text-light border-secondary ps-5" data-page="comissoes-dashboard">
                            Visão geral
                        </a>
                        <a href="#" class="list-group-item list-group-item-action bg-black text-light border-secondary ps-5" data-page="comissoes-historico">
                            Histórico de comissões
                        </a>
                        <a href="#" class="list-group-item list-group-item-action bg-black text-light border-secondary ps-5" data-page="comissoes-tecnicos">
                            Técnicos
                        </a>
                        <a href="#" class="list-group-item list-group-item-action bg-black text-light border-secondary ps-5" data-page="comissoes-solicitacao">
                            Solicitação de crédito
                        </a>
                    </div>

                    <a href="#"
                        class="list-group-item list-group-item-action bg-black text-light border-secondary"
                        data-page="mensagens">
                        <i class="bi bi-chat-dots me-2"></i>
                        Mensagens
                    </a>

                    <div class="sidebar-submenu">
                        <a href="#" class="list-group-item list-group-item-action bg-black text-light border-secondary ps-5" data-page="templates">Templates</a>
                        <a href="#" class="list-group-item list-group-item-action bg-black text-light border-secondary ps-5" data-page="envio">Envio individual</a>
                    </div>

                    <a href="#"
                        class="list-group-item list-group-item-action bg-black text-light border-secondary"
                        data-page="configuracoes">
                        <i class="bi bi-gear me-2"></i>
                        Configurações
                    </a>

                </div>

            </aside>

            <!-- Conteúdo -->
            <main class="col-lg-10 py-4 px-3 px-lg-4 app-content">

                <div id="content"></div>

            </main>

        </div>

    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dashboard -->
    <script src="/js/dashboard/dashboard.js"></script>

    <!-- Clientes -->
    <script src="/js/clientes/clientes.js"></script>

    <!-- Templates -->
    <script src="/js/mensagens/template.js"></script>

    <!-- Histórico -->
   <script src="/js/mensagens/historico.js"></script>

    <!-- Envio -->
   <script src="/js/mensagens/envio.js"></script>

    <!-- Campanha -->
   <script src="/js/campanhas/campanhas.js"></script>

    <!-- Router -->
    <script src="/js/router.js"></script>

    <!-- App -->
    <script src="/js/app.js"></script>

</body>

</html>
